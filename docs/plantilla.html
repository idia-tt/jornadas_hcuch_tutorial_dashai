<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<style>

:root{--bg:#fff;--fg:#1a1a1a;--mut:#555;--ln:#d8d8d8;--code:#f1f1f1;--a:#1a5fb4}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#e8e8e8;--mut:#aaa;--ln:#3a3a3a;--code:#262626;--a:#7fb2f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:44rem;margin:0 auto;padding:16px}
h1{font-size:1.7rem;line-height:1.25;margin:1.2em 0 .4em}
h2{font-size:1.4rem;margin:2em 0 .5em;padding-top:.6em;border-top:1px solid var(--ln)}
h3{font-size:1.15rem;margin:1.6em 0 .4em}
a{color:var(--a)}
code{background:var(--code);padding:.1em .35em;border-radius:4px;font-size:.92em;word-break:break-word}
li{margin:.3em 0}
img{max-width:100%;height:auto}
nav{background:var(--code);border-radius:8px;padding:8px 16px;margin:1em 0}
nav ol{margin:.3em 0;padding-left:1.4em}
pre.mermaid{background:#fff;color:#1a1a1a;padding:12px;margin:12px 0;border-radius:8px;overflow-x:auto}
@media (max-width:30rem){body{font-size:16px}}

pre{background:var(--code);padding:16px;border-radius:8px;overflow-x:auto}
pre code{padding:0;word-break:normal}
blockquote{border-left:4px solid var(--a);margin:1em 0;padding:4px 16px;background:var(--code)}
.logos{display:flex;align-items:center;background:#fff;border-radius:16px;overflow:hidden}
.logos a{flex:1;min-width:0;text-align:center}
.logos img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<!-- Generado desde $source con scripts/generar_html.py; edita el Markdown. -->
<main>
$banner
$body
</main>
$scripts
</body>
</html>
